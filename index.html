<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COASTVIBE</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="lumina_style.css">
</head>
<body>

    <div class="bg-decorations">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-text">COASTVIBE</span>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">Main menu/Menu chính</div>
                <a href="#" class="nav-link active">
                    <i class="bi bi-house-door-fill"></i>
                    <span>Trang chủ - home</span>
                </a>
                <a href="#" class="nav-link">
                    <i class="bi bi-compass"></i>
                    <span>Khám phá - explore</span>
                </a>
                <a href="#" class="nav-link">
                    <i class="bi bi-collection-play"></i>
                    <span>Thư viện - library</span>
                </a>
            </div>

            <div class="nav-section mt-5">
                <div class="nav-section-title">Cá nhân</div>
                <a href="#" class="nav-link">
                    <i class="bi bi-heart"></i>
                    <span>Yêu thích - favorite song</span>
                </a>
                <a href="#" class="nav-link">
                    <i class="bi bi-music-note-list"></i>
                    <span>Playlist</span>
                </a>
                <a href="#" class="nav-link">
                    <i class="bi bi-mic"></i>
                    <span>Nghệ sĩ - singer</span>
                </a>
            </div>

            <div class="mt-auto user-profile d-flex align-items-center gap-3 pt-4 border-top border-white border-opacity-10">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=100&auto=format&fit=crop" style="width: 40px; height: 40px; border-radius: 50%;">
                <div class="profile-info">
                    <div style="font-weight: 600; font-size: 0.9rem;">Thế Khang</div>
                    <div style="font-size: 0.7rem; opacity: 0.5;">Premium</div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <div class="search-bar-container">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" class="search-input" placeholder="Tìm kiếm âm nhạc, podcast...">
                </div>
                <div class="header-actions" style="display:flex;align-items:center;gap:12px;">
                    <button id="spotify-connect-btn" class="btn btn-spotify" style="background:#1DB954;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer">Kết nối Spotify</button>
                    <div id="spotify-status" style="font-size:0.85rem;color:rgba(255,255,255,0.7);"></div>
                </div>
            </header>

            <section>
                <div class="section-header">
                    <h2 class="section-title">Khám phá mới</h2>
                    <a href="#" style="color: rgba(255,255,255,0.4); text-decoration: none; font-size: 0.85rem;">Xem tất cả</a>
                </div>
                <div class="music-grid" id="music-grid">
                    <!-- Songs will be injected here by JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Player Bar -->
    <div class="player-bar">
        <div class="now-playing">
            <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=300&auto=format&fit=crop" class="now-playing-img" id="track-art">
            <div class="now-playing-info">
                <div class="track-name" id="track-name">Midnight City</div>
                <div class="artist-name" id="artist-name">M83</div>
            </div>
            <button class="btn-icon ms-3"><i class="bi bi-plus-circle"></i></button>
        </div>

        <div class="controls-container">
            <div class="btn-group">
                <button class="btn-icon" id="shuffle-btn"><i class="bi bi-shuffle"></i></button>
                <button class="btn-icon" id="prev-btn"><i class="bi bi-skip-start-fill" style="font-size: 1.5rem;"></i></button>
                <button class="btn-icon btn-play-pause" id="play-pause-btn">
                    <i class="bi bi-play-fill" style="font-size: 1.8rem;"></i>
                </button>
                <button class="btn-icon" id="next-btn"><i class="bi bi-skip-end-fill" style="font-size: 1.5rem;"></i></button>
                <button class="btn-icon" id="repeat-btn"><i class="bi bi-repeat"></i></button>
            </div>
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bg" id="progress-bg">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="extra-controls">
            <i class="bi bi-volume-up" id="volume-icon" style="opacity: 0.5;"></i>
            <div class="volume-slider" id="volume-slider">
                <div class="volume-fill" id="volume-fill"></div>
            </div>
            <button class="btn-icon ms-3"><i class="bi bi-pip"></i></button>
            <button class="btn-icon"><i class="bi bi-list"></i></button>
        </div>
    </div>

    <!-- Custom JS -->
    <script src="spotify.js"></script>
    <script src="lumina_script.js"></script>
</body>
</html>
