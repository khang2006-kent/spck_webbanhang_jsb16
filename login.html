<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập |COASTVIBE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth_pure.css">
</head>
<body>
    <div class="auth-bg"></div>
    <div class="glass-card">
        <h1>Đăng nhập</h1>
        <p class="subtitle">Chào mừng bạn trở lại với âm nhạc.</p>
        
        <form action="index.html">
            <div class="form-group">
                <label>Email</label>
                <input type="email" class="glass-input" placeholder="ten@vidu.com" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" class="glass-input" placeholder="••••••••" required>
            </div>
            
            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 2rem;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox"> Ghi nhớ tôi
                </label>
                <a href="#" style="color: rgba(255,255,255,0.4); text-decoration: none;">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn-primary">Đăng nhập ngay</button>
        </form>

        <div class="footer-text">
            Chưa có tài khoản? <a href="register.html">Đăng ký tại đây</a>
        </div>
    </div>
</body>
</html>
