<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký | Lumina Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth_pure.css">
</head>
<body>
    <div class="auth-bg"></div>
    <div class="glass-card">
        <h1>Tạo tài khoản</h1>
        <p class="subtitle">Bắt đầu hành trình khám phá âm nhạc của bạn.</p>
        
        <form action="index.html">
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" class="glass-input" placeholder="Nguyễn Văn A" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" class="glass-input" placeholder="ten@vidu.com" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" class="glass-input" placeholder="Tối thiểu 8 ký tự" required>
            </div>
            
            <button type="submit" class="btn-primary">Đăng ký ngay</button>
        </form>

        <div class="footer-text">
            Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
        </div>
    </div>
</body>
</html>
